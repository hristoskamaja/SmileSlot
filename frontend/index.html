<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SmileSlot</title>
    <!-- Sets the theme before the first paint, so dark mode doesn't start with a white flash.
         Same rule as getInitialTheme() in src/lib/theme.ts: dark only if the user chose it, otherwise light. -->
    <script>
      try {
        if (localStorage.getItem('smileslot-theme') === 'dark') {
          document.documentElement.classList.add('dark')
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
