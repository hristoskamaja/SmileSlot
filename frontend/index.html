<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SmileSlot</title>
    <!-- Sets the theme before the first paint, so dark mode doesn't start with a white flash.
         Same rule as getInitialTheme() in src/lib/theme.ts: saved choice first, then the system setting. -->
    <script>
      var theme = null
      try {
        theme = localStorage.getItem('smileslot-theme')
      } catch (e) {}
      if (theme === 'dark' || (theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark')
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
