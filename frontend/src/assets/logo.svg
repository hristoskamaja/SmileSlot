<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- calendar body: soft mint -->
  <rect x="3" y="6" width="26" height="23" rx="6" fill="#CCFBF1"/>
  <!-- header band: same outline as the body, cut off below the rings -->
  <path d="M3 14v-2a6 6 0 0 1 6-6h14a6 6 0 0 1 6 6v2z" fill="#14B8A6"/>
  <!-- teal outline on top, so the band and the body share one clean edge -->
  <rect x="3" y="6" width="26" height="23" rx="6" stroke="#14B8A6" stroke-width="2"/>
  <!-- binding rings -->
  <rect x="9.5" y="3" width="3" height="7" rx="1.5" fill="#14B8A6" stroke="#CCFBF1" stroke-width="1"/>
  <rect x="19.5" y="3" width="3" height="7" rx="1.5" fill="#14B8A6" stroke="#CCFBF1" stroke-width="1"/>
  <!-- tooth -->
  <path d="M11 19.2c0-2 1.5-3.2 3.2-3.2 1 0 1.2.4 1.8.4s.8-.4 1.8-.4c1.7 0 3.2 1.2 3.2 3.2 0 1.4-.5 2.1-.9 3.2-.4 1.1-.6 2.7-1.1 3.6-.4.7-1.4.7-1.7 0-.4-.9-.5-1.9-1.3-1.9s-.9 1-1.3 1.9c-.3.7-1.3.7-1.7 0-.5-.9-.7-2.5-1.1-3.6-.4-1.1-.9-1.8-.9-3.2z" fill="#14B8A6"/>
</svg>
